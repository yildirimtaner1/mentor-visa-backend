<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Title/description/OG/Twitter are provided per-page via react-helmet-async (SEO component).
         Static copies were removed: Helmet cannot replace them, so every page shipped DUPLICATE
         meta tags and parsers picked the wrong (homepage) og:url. Social crawlers get their meta
         from the Vercel edge middleware; Googlebot renders the JS. -->
    <title>Mentor Visa — AI-Powered Tools for Canadian Express Entry</title>

    <!-- Organization + WebSite structured data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://mentorvisa.com/#organization",
          "name": "Mentor Visa",
          "url": "https://mentorvisa.com",
          "logo": "https://mentorvisa.com/logo.png",
          "description": "AI-powered tools for Canadian Express Entry: NOC Finder, Employment Letter Auditor, CRS Calculator, and PR Application Tracker."
        },
        {
          "@type": "WebSite",
          "@id": "https://mentorvisa.com/#website",
          "url": "https://mentorvisa.com",
          "name": "Mentor Visa",
          "publisher": { "@id": "https://mentorvisa.com/#organization" }
        }
      ]
    }
    </script>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=%VITE_GA_MEASUREMENT_ID%"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', '%VITE_GA_MEASUREMENT_ID%');
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
